name: CI

on:
  push:
    branches:
      - dev

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lidar_dashboard_ci
          POSTGRES_USER: lidar_dashboard_ci
          POSTGRES_PASSWORD: lidar_dashboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lidar_dashboard_ci -d lidar_dashboard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lidar_dashboard_ci:lidar_dashboard_ci@localhost:5432/lidar_dashboard_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-change-in-field
      SEED_ADMIN_USER_ID: admin
      SEED_ADMIN_PASSWORD: admin1234!
      SEED_ADMIN_NAME: CI Administrator
      CONTROL_BOARD_DRY_RUN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm --prefix dashboard/dashboard-web ci --include=optional

      - name: Run smoke contracts
        run: npm run smoke

      - name: Run server package tests
        run: npm run server:test

      - name: Run Prisma migration and seed checks
        run: npm run ci:db

      - name: Run frontend lint
        run: npm --prefix dashboard/dashboard-web run lint

      - name: Run build checks
        run: npm run ci

      - name: Run audit policy
        run: npm run verify:audit-policy

      - name: Validate Docker Compose config
        run: docker compose config --quiet
